<!-- app/templates/admin/_layout.html -->
{% extends "base.html" %}

{% block content %}
<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <a href="{{ url_for('main.index') }}" class="admin-brand">
                <span class="brand-icon">🖨️</span>
                <span class="brand-name">{{ company_name }}</span>
            </a>
        </div>
        
        <nav class="admin-nav">
            <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-item {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
                <i class="fas fa-chart-pie" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>
            <a href="{{ url_for('admin.services') }}" class="admin-nav-item {% if request.endpoint == 'admin.services' or request.endpoint == 'admin.new_service' or request.endpoint == 'admin.edit_service' %}active{% endif %}">
                <i class="fas fa-cubes" aria-hidden="true"></i>
                <span>Services</span>
            </a>
            <a href="{{ url_for('admin.categories') }}" class="admin-nav-item {% if request.endpoint == 'admin.categories' %}active{% endif %}">
                <i class="fas fa-tags" aria-hidden="true"></i>
                <span>Categories</span>
            </a>
            <a href="{{ url_for('admin.orders') }}" class="admin-nav-item {% if request.endpoint == 'admin.orders' %}active{% endif %}">
                <i class="fas fa-shopping-bag" aria-hidden="true"></i>
                <span>Orders</span>
            </a>
            <a href="{{ url_for('admin.bookings') }}" class="admin-nav-item {% if request.endpoint == 'admin.bookings' %}active{% endif %}">
                <i class="fas fa-calendar-check" aria-hidden="true"></i>
                <span>Bookings</span>
            </a>
        </nav>
        
        <div class="admin-sidebar-footer">
            <a href="{{ url_for('main.index') }}" class="admin-nav-item">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                <span>Back to Site</span>
            </a>
            <a href="{{ url_for('auth.logout') }}" class="admin-nav-item logout">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-content">
        <div class="admin-content-header">
            <h2>{% block admin_title %}Admin Panel{% endblock %}</h2>
            <div class="admin-user-info">
                <span class="admin-user-name">{{ current_user.full_name }}</span>
                <span class="admin-user-role">Admin</span>
            </div>
        </div>
        
        <div class="admin-content-body">
            {% block admin_content %}{% endblock %}
        </div>
    </main>
</div>

<!-- Admin Layout Styles -->
<style>
.admin-wrapper {
    display: flex;
    min-height: calc(100vh - 64px);
    background: var(--bg-color, #f8fafc);
}

.admin-sidebar {
    width: 240px;
    background: var(--bg-card, white);
    border-right: 1px solid var(--border-color, #e2e8f0);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    flex-shrink: 0;
}

.admin-sidebar-header {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border-color, #e2e8f0);
    margin-bottom: 16px;
}

.admin-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text-color, #0f172a);
}
.admin-brand .brand-icon {
    font-size: 1.3rem;
}
.admin-brand .brand-name {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.admin-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
    flex: 1;
}

.admin-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    color: var(--text-muted, #64748b);
    text-decoration: none;
    transition: all 0.2s ease;
    font-weight: 500;
    font-size: 0.9rem;
}
.admin-nav-item:hover {
    background: var(--bg-elevated, #f1f5f9);
    color: var(--text-color, #0f172a);
}
.admin-nav-item.active {
    background: rgba(139, 92, 246, 0.08);
    color: #8b5cf6;
}
.admin-nav-item i {
    width: 20px;
    text-align: center;
    font-size: 1rem;
}
.admin-nav-item.logout {
    color: #ef4444;
}
.admin-nav-item.logout:hover {
    background: rgba(239, 68, 68, 0.06);
    color: #dc2626;
}

.admin-sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border-color, #e2e8f0);
    margin-top: auto;
}

.admin-content {
    flex: 1;
    padding: 24px 32px;
    overflow-y: auto;
}

.admin-content-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
}
.admin-content-header h2 {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-color, #0f172a);
    margin: 0;
}
.admin-user-info {
    display: flex;
    align-items: center;
    gap: 12px;
}
.admin-user-name {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text-color, #0f172a);
}
.admin-user-role {
    background: rgba(139, 92, 246, 0.1);
    color: #8b5cf6;
    padding: 2px 12px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 600;
}

/* Responsive */
@media (max-width: 768px) {
    .admin-sidebar {
        width: 60px;
        padding: 12px 0;
    }
    .admin-sidebar-header {
        padding: 0 12px 12px;
    }
    .admin-brand .brand-name,
    .admin-nav-item span,
    .admin-user-name,
    .admin-user-role {
        display: none;
    }
    .admin-nav-item {
        justify-content: center;
        padding: 12px;
    }
    .admin-nav-item i {
        font-size: 1.2rem;
    }
    .admin-content {
        padding: 16px;
    }
    .admin-content-header h2 {
        font-size: 1.1rem;
    }
}
</style>
{% endblock %}
