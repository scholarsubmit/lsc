{% extends "base.html" %}
{% block title %}Log in — {{ company_name }}{% endblock %}
{% block content %}
<section class="container" style="padding-top:56px;padding-bottom:56px;">
  <form method="post" class="form-card">
    <h1 style="font-size:1.5rem;text-align:center;">Welcome back</h1>
    <p class="muted text-center" style="margin-bottom:24px;">Log in to manage your bookings and orders.</p>

    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" required>
        <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
          <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group checkbox-row">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember" style="margin:0;font-weight:500;">Remember me</label>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
    <p class="text-center muted" style="margin-top:18px;font-size:0.9rem;">
      New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
    </p>
  </form>
</section>
{% endblock %}
