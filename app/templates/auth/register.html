{% extends "base.html" %}
{% block title %}Create account — {{ company_name }}{% endblock %}
{% block content %}
<style>
  /* ── Base Animation Keyframes ── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes float-delayed {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%      { transform: translateY(-15px) rotate(3deg); }
  }
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
  }
  @keyframes blob-morph {
    0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    25%      { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
    50%      { border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%; }
    75%      { border-radius: 60% 40% 60% 30% / 70% 30% 50% 60%; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes check-bounce {
    0%   { transform: scale(0); }
    50%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  @keyframes progress-fill {
    from { width: 0%; }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes confetti-pop {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
  }

  /* ── Page Background ── */
  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 30%, #f5f3ff 60%, #fdf4ff 100%);
    padding: 40px 20px;
  }

  /* Animated background blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    animation: blob-morph 15s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 {
    width: 450px; height: 450px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    top: -120px; right: -100px;
    animation-delay: 0s;
  }
  .blob-2 {
    width: 380px; height: 380px;
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    bottom: -100px; left: -80px;
    animation-delay: -5s;
  }
  .blob-3 {
    width: 300px; height: 300px;
    background: linear-gradient(135deg, #f59e0b, #f97316);
    top: 40%; left: 60%;
    animation-delay: -10s;
    opacity: 0.2;
  }

  /* Floating shapes */
  .shape {
    position: absolute;
    pointer-events: none;
    z-index: 0;
    opacity: 0.12;
  }
  .shape-circle {
    width: 50px; height: 50px;
    border: 3px solid #8b5cf6;
    border-radius: 50%;
    animation: float 7s ease-in-out infinite;
  }
  .shape-square {
    width: 35px; height: 35px;
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    border-radius: 8px;
    animation: float-delayed 9s ease-in-out infinite;
  }
  .shape-ring {
    width: 70px; height: 70px;
    border: 2px dashed #ec4899;
    border-radius: 50%;
    animation: spin 25s linear infinite;
  }

  /* ── Main Card ── */
  .auth-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(28px) saturate(1.8);
    -webkit-backdrop-filter: blur(28px) saturate(1.8);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 28px;
    padding: 48px 40px 40px;
    box-shadow:
      0 4px 6px -1px rgba(0,0,0,0.04),
      0 10px 15px -3px rgba(0,0,0,0.04),
      0 20px 40px -10px rgba(0,0,0,0.06),
      0 40px 60px -20px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.9);
    animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }

  /* Card top accent */
  .auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 4px;
    background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899, #f59e0b);
    border-radius: 0 0 4px 4px;
    animation: fadeIn 1s ease 0.6s both;
  }

  /* ── Header ── */
  .auth-header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
  }

  .auth-logo {
    width: 68px; height: 68px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
    background-size: 200% 200%;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    animation: float 5s ease-in-out infinite;
    position: relative;
    overflow: hidden;
  }
  .auth-logo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
    animation: shimmer 3.5s ease-in-out infinite;
    background-size: 200% 100%;
  }
  .auth-logo svg {
    width: 30px; height: 30px;
    color: white;
    position: relative;
    z-index: 1;
  }

  .auth-title {
    font-size: 1.75rem;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .auth-subtitle {
    font-size: 0.95rem;
    color: #64748b;
    margin: 0;
    font-weight: 400;
  }

  /* ── Social Login ── */
  .social-login {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    animation: fadeInUp 0.5s ease 0.35s both;
  }
  .social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 14px;
    background: rgba(255,255,255,0.6);
    color: #475569;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
  }
  .social-btn:hover {
    border-color: #cbd5e1;
    background: rgba(255,255,255,0.9);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .social-btn:active {
    transform: translateY(0);
  }
  .social-btn svg {
    width: 20px; height: 20px;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    animation: fadeIn 0.5s ease 0.45s both;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
  }
  .divider-text {
    font-size: 0.75rem;
    color: #94a3b8;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── Form ── */
  .auth-form {
    animation: fadeInUp 0.5s ease 0.5s both;
  }

  .form-group {
    margin-bottom: 18px;
    position: relative;
  }
  .form-group label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
    transition: color 0.2s ease;
  }
  .form-group:focus-within label {
    color: #8b5cf6;
  }

  .input-wrapper {
    position: relative;
  }
  .input-wrapper .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    transition: color 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 2;
  }
  .form-group:focus-within .input-icon {
    color: #8b5cf6;
    transform: translateY(-50%) scale(1.1);
  }

  .input-wrapper input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 0.9375rem;
    font-weight: 500;
    color: #0f172a;
    background: rgba(255,255,255,0.7);
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    outline: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-sizing: border-box;
  }
  .input-wrapper input::placeholder {
    color: #94a3b8;
    font-weight: 400;
  }
  .input-wrapper input:focus {
    border-color: #8b5cf6;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1), 0 4px 12px rgba(139, 92, 246, 0.08);
  }

  /* Form row for side-by-side */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 480px) {
    .form-row { grid-template-columns: 1fr; }
  }

  /* Password field */
  .password-field .input-wrapper input {
    padding-right: 48px;
  }
  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: #94a3b8;
    transition: all 0.2s ease;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .password-toggle:hover {
    color: #8b5cf6;
    background: rgba(139, 92, 246, 0.08);
  }
  .password-toggle svg {
    width: 18px; height: 18px;
  }
  .password-toggle .icon-eye-off { display: none; }
  .password-toggle.showing .icon-eye { display: none; }
  .password-toggle.showing .icon-eye-off { display: block; }

  /* ── Password Strength Meter ── */
  .strength-meter {
    margin-top: 8px;
    height: 4px;
    background: #e2e8f0;
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .strength-meter.visible { opacity: 1; }
  .strength-bar {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
  }
  .strength-bar.weak { background: #ef4444; width: 33%; }
  .strength-bar.fair  { background: #f59e0b; width: 66%; }
  .strength-bar.strong { background: #10b981; width: 100%; }
  .strength-text {
    font-size: 0.75rem;
    margin-top: 4px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .strength-text.visible { opacity: 1; }
  .strength-text.weak { color: #ef4444; }
  .strength-text.fair { color: #f59e0b; }
  .strength-text.strong { color: #10b981; }

  /* ── Terms Checkbox ── */
  .terms-wrap {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 20px;
    cursor: pointer;
    animation: fadeInUp 0.4s ease 0.7s both;
  }
  .terms-wrap input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border: 2px solid #cbd5e1;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .terms-wrap input[type="checkbox"]:checked {
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    border-color: transparent;
    animation: check-bounce 0.3s ease;
  }
  .terms-wrap input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 5px; top: 2px;
    width: 5px; height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .terms-wrap input[type="checkbox"]:focus {
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
  }
  .terms-wrap label {
    font-size: 0.8125rem;
    color: #64748b;
    line-height: 1.5;
    cursor: pointer;
    margin: 0;
  }
  .terms-wrap a {
    color: #8b5cf6;
    font-weight: 600;
    text-decoration: none;
    position: relative;
  }
  .terms-wrap a::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0;
    width: 0; height: 1.5px;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
    transition: width 0.3s ease;
  }
  .terms-wrap a:hover::after { width: 100%; }

  /* ── Submit Button ── */
  .btn-submit {
    width: 100%;
    padding: 16px 24px;
    font-size: 1rem;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #ec4899 100%);
    background-size: 200% 200%;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3), 0 8px 32px rgba(236, 72, 153, 0.15);
    animation: fadeInUp 0.5s ease 0.75s both;
    letter-spacing: 0.01em;
  }
  .btn-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 3s ease-in-out infinite;
  }
  .btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4), 0 16px 48px rgba(236, 72, 153, 0.2);
    background-position: 100% 0;
  }
  .btn-submit:active {
    transform: translateY(-1px);
  }
  .btn-submit .btn-text {
    position: relative;
    z-index: 1;
  }
  .btn-submit .btn-arrow {
    display: inline-block;
    margin-left: 6px;
    transition: transform 0.3s ease;
  }
  .btn-submit:hover .btn-arrow {
    transform: translateX(4px);
  }

  /* Loading state */
  .btn-submit.loading {
    pointer-events: none;
    opacity: 0.85;
  }
  .btn-submit.loading .btn-text { opacity: 0; }
  .btn-submit .spinner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 24px; height: 24px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .btn-submit.loading .spinner { opacity: 1; }

  /* Success state */
  .btn-submit.success {
    background: linear-gradient(135deg, #10b981, #059669);
    pointer-events: none;
  }
  .btn-submit.success .btn-text { opacity: 0; }
  .btn-submit .success-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    color: white;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-submit.success .success-icon {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* ── Footer ── */
  .auth-footer {
    text-align: center;
    margin-top: 22px;
    animation: fadeInUp 0.4s ease 0.85s both;
  }
  .auth-footer p {
    font-size: 0.9rem;
    color: #64748b;
    margin: 0;
  }
  .auth-footer a {
    color: #8b5cf6;
    font-weight: 700;
    text-decoration: none;
    position: relative;
    transition: color 0.2s ease;
  }
  .auth-footer a::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 0; height: 2px;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
    transition: width 0.3s ease;
    border-radius: 1px;
  }
  .auth-footer a:hover {
    color: #7c3aed;
  }
  .auth-footer a:hover::after { width: 100%; }

  /* ── Error Shake ── */
  .auth-card.shake {
    animation: shake 0.5s ease;
  }

  /* ── Confetti ── */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confetti-pop 1.2s ease-out forwards;
  }

  /* ── Responsive ── */
  @media (max-width: 520px) {
    .auth-card {
      padding: 32px 22px 28px;
      border-radius: 22px;
    }
    .auth-title { font-size: 1.5rem; }
    .social-login { flex-direction: column; }
  }

  /* ── Dark mode support ── */
  @media (prefers-color-scheme: dark) {
    .auth-page {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #1e293b 100%);
    }
    .auth-card {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(255,255,255,0.06);
      box-shadow:
        0 4px 6px -1px rgba(0,0,0,0.2),
        0 10px 15px -3px rgba(0,0,0,0.2),
        0 20px 40px -10px rgba(0,0,0,0.3),
        0 40px 60px -20px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .auth-title { color: #f8fafc; }
    .auth-subtitle { color: #94a3b8; }
    .input-wrapper input {
      background: rgba(15, 23, 42, 0.5);
      border-color: #334155;
      color: #f1f5f9;
    }
    .input-wrapper input:focus {
      background: rgba(15, 23, 42, 0.7);
      border-color: #a78bfa;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15), 0 4px 12px rgba(139, 92, 246, 0.1);
    }
    .input-wrapper input::placeholder { color: #64748b; }
    .social-btn {
      background: rgba(30, 41, 59, 0.5);
      border-color: #334155;
      color: #cbd5e1;
    }
    .social-btn:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: #475569;
    }
    .terms-wrap label { color: #94a3b8; }
    .terms-wrap input[type="checkbox"] { border-color: #475569; }
    .auth-footer p { color: #94a3b8; }
    .divider-line {
      background: linear-gradient(90deg, transparent, #334155, transparent);
    }
    .strength-meter { background: #334155; }
  }
</style>

<section class="auth-page">
  <!-- Animated background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Floating shapes -->
  <div class="shape shape-circle" style="top: 12%; left: 8%;"></div>
  <div class="shape shape-square" style="top: 65%; left: 6%;"></div>
  <div class="shape shape-ring" style="bottom: 15%; right: 8%;"></div>
  <div class="shape shape-circle" style="top: 30%; right: 10%; width: 35px; height: 35px; border-color: #06b6d4;"></div>

  <div class="auth-card" id="registerCard">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Book sessions, track orders, and reorder favourites</p>
    </div>

    <!-- Social Login -->
    <div class="social-login">
      <button type="button" class="social-btn" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5.04c1.74 0 3.3.6 4.53 1.77l3.4-3.4C17.95 1.18 15.24 0 12 0 7.31 0 3.23 2.7 1.54 6.61l3.94 3.05C6.46 6.67 8.98 5.04 12 5.04z"/><path fill="#4285F4" d="M23.5 12.28c0-.82-.07-1.61-.2-2.36H12v4.47h6.45c-.28 1.48-1.1 2.73-2.34 3.57l3.78 2.93C21.8 18.75 23.5 15.74 23.5 12.28z"/><path fill="#FBBC05" d="M5.48 14.09l-3.94 3.05C3.23 21.3 7.31 24 12 24c3.24 0 5.95-1.07 7.93-2.91l-3.78-2.93c-1.07.72-2.44 1.14-4.15 1.14-3.02 0-5.54-1.63-6.52-4.21z"/><path fill="#34A853" d="M12 5.04c3.02 0 5.54 1.63 6.52 4.21l3.94-3.05C20.77 2.7 16.69 0 12 0 8.76 0 6.05 1.18 4.07 3.41l3.94 3.05c.98-2.58 3.5-4.21 6.52-4.21z"/></svg>
        Google
      </button>
      <button type="button" class="social-btn" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.22 7.13-.57 1.5-1.31 2.99-2.27 4.08zm-5.85-15.1c.07-2.04 1.76-3.79 3.74-3.94.29 2.32-1.93 4.48-3.74 3.94z"/></svg>
        Apple
      </button>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or sign up with email</span>
      <div class="divider-line"></div>
    </div>

    <form method="post" class="auth-form" id="registerForm" novalidate>
      <div class="form-group">
        <label for="full_name">Full name</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="full_name" name="full_name" placeholder="John Doe" required autofocus value="{{ form_data.get('full_name', '') }}" autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="email" name="email" placeholder="name@company.com" required value="{{ form_data.get('email', '') }}" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone number</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" value="{{ form_data.get('phone', '') }}" autocomplete="tel">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group password-field">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
        </div>

        <div class="form-group password-field">
          <label for="confirm_password">Confirm password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="Show password" data-target="confirm_password">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="terms-wrap">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Create account <span class="btn-arrow">→</span></span>
        <span class="spinner"></span>
        <svg class="success-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
  </div>

  <!-- Confetti container -->
  <div class="confetti-container" id="confettiContainer"></div>
</section>

<script>
(function() {
  'use strict';

  // ── Password Toggle ──
  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', function() {
      const targetId = this.dataset.target;
      const input = document.getElementById(targetId);
      const isVisible = input.type === 'text';
      input.type = isVisible ? 'password' : 'text';
      this.classList.toggle('showing', !isVisible);
      this.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
    });
  });

  // ── Password Strength Meter ──
  const passwordInput = document.getElementById('password');
  const strengthMeter = document.getElementById('strengthMeter');
  const strengthBar = document.getElementById('strengthBar');
  const strengthText = document.getElementById('strengthText');

  function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    return score;
  }

  passwordInput.addEventListener('input', function() {
    const val = this.value;
    if (val.length === 0) {
      strengthMeter.classList.remove('visible');
      strengthText.classList.remove('visible');
      return;
    }
    strengthMeter.classList.add('visible');
    strengthText.classList.add('visible');

    const score = checkStrength(val);
    strengthBar.className = 'strength-bar';
    strengthText.className = 'strength-text visible';

    if (score <= 2) {
      strengthBar.classList.add('weak');
      strengthText.classList.add('weak');
      strengthText.textContent = 'Weak password';
    } else if (score <= 4) {
      strengthBar.classList.add('fair');
      strengthText.classList.add('fair');
      strengthText.textContent = 'Fair password';
    } else {
      strengthBar.classList.add('strong');
      strengthText.classList.add('strong');
      strengthText.textContent = 'Strong password';
    }
  });

  // ── Password Match Check ──
  const confirmInput = document.getElementById('confirm_password');
  confirmInput.addEventListener('input', function() {
    if (this.value && this.value !== passwordInput.value) {
      this.style.borderColor = '#ef4444';
    } else {
      this.style.borderColor = '';
    }
  });

  // ── Form Submit with Loading & Confetti ──
  const form = document.getElementById('registerForm');
  const submitBtn = document.getElementById('submitBtn');
  const card = document.getElementById('registerCard');
  const confettiContainer = document.getElementById('confettiContainer');

  function spawnConfetti() {
    const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b', '#06b6d4', '#10b981', '#3b82f6'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.top = '-10px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.width = (Math.random() * 8 + 6) + 'px';
      piece.style.height = (Math.random() * 8 + 6) + 'px';
      piece.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
      piece.style.setProperty('--ty', (Math.random() * 400 + 300) + 'px');
      piece.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      piece.style.animationDuration = (Math.random() * 0.6 + 0.8) + 's';
      confettiContainer.appendChild(piece);
      setTimeout(() => piece.remove(), 2000);
    }
  }

  form.addEventListener('submit', function(e) {
    const fullName = document.getElementById('full_name');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm_password');
    const terms = document.getElementById('terms');
    let valid = true;

    [fullName, email, password, confirm].forEach(field => {
      if (!field.value.trim()) {
        field.style.borderColor = '#ef4444';
        valid = false;
      }
    });

    if (password.value !== confirm.value) {
      confirm.style.borderColor = '#ef4444';
      valid = false;
    }

    if (!terms.checked) {
      terms.parentElement.style.animation = 'shake 0.4s ease';
      setTimeout(() => { terms.parentElement.style.animation = ''; }, 400);
      valid = false;
    }

    if (!valid) {
      e.preventDefault();
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 500);

      setTimeout(() => {
        [fullName, email, password, confirm].forEach(f => f.style.borderColor = '');
      }, 2500);
      return;
    }

    // Show loading
    submitBtn.classList.add('loading');

    // Simulate success (remove this in production — let server handle redirect)
    // In real use, the form submits normally. This is just for the demo effect:
    setTimeout(() => {
      submitBtn.classList.remove('loading');
      submitBtn.classList.add('success');
      spawnConfetti();
    }, 1500);
  });

  // ── Input reset on type ──
  document.querySelectorAll('.input-wrapper input').forEach(input => {
    input.addEventListener('input', function() {
      this.style.borderColor = '';
    });
  });

  // ── Staggered entrance for form elements ──
  const groups = document.querySelectorAll('.form-group');
  groups.forEach((group, i) => {
    group.style.opacity = '0';
    group.style.animation = `fadeInUp 0.4s ease ${0.5 + i * 0.07}s both`;
  });

  // ── Parallax on mouse move ──
  const page = document.querySelector('.auth-page');
  page.addEventListener('mousemove', function(e) {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    document.querySelectorAll('.blob').forEach((blob, i) => {
      const factor = (i + 1) * 0.25;
      blob.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
    });
  });

  // ── Lazy Loader Utility (for images elsewhere on the site) ──
  window.LazyLoader = {
    init: function(selector = 'img[data-src]') {
      const images = document.querySelectorAll(selector);
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              img.src = img.dataset.src;
              img.classList.add('lazy-loaded');
              img.removeAttribute('data-src');
              observer.unobserve(img);
            }
          });
        }, { rootMargin: '50px 0px', threshold: 0.01 });
        images.forEach(img => observer.observe(img));
      } else {
        // Fallback for older browsers
        images.forEach(img => {
          img.src = img.dataset.src;
          img.classList.add('lazy-loaded');
        });
      }
    },
    // Add shimmer skeleton while loading
    addSkeleton: function(img) {
      img.style.background = 'linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%)';
      img.style.backgroundSize = '200% 100%';
      img.style.animation = 'shimmer 1.5s infinite';
      img.addEventListener('load', () => {
        img.style.background = '';
        img.style.animation = '';
      });
    }
  };

  // Auto-init lazy loader if images exist
  if (document.querySelector('img[data-src]')) {
    window.LazyLoader.init();
  }
})();
</script>
{% endblock %}
