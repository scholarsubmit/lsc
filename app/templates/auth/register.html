{% extends "base.html" %}
{% block title %}Create account — {{ company_name }}{% endblock %}
{% block content %}
<section class="container" style="padding-top:56px;padding-bottom:56px;">
  <form method="post" class="form-card">
    <h1 style="font-size:1.5rem;text-align:center;">Create your account</h1>
    <p class="muted text-center" style="margin-bottom:24px;">Book sessions, track orders, and reorder favourites.</p>

    <div class="form-group">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name" required autofocus value="{{ form_data.get('full_name', '') }}">
    </div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required value="{{ form_data.get('email', '') }}">
    </div>
    <div class="form-group">
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" value="{{ form_data.get('phone', '') }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
    <p class="text-center muted" style="margin-top:18px;font-size:0.9rem;">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </form>
</section>
{% endblock %}
