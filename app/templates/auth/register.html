{% extends "base.html" %}
{% block title %}Create account — {{ company_name }}{% endblock %}
{% block content %}
<section class="container" style="padding-top:56px;padding-bottom:56px;">
  <form method="post" class="form-card">
    <h1 style="font-size:1.5rem;text-align:center;">Create your account</h1>
    <p class="muted text-center" style="margin-bottom:24px;">Book sessions, track orders, and reorder favourites.</p>

    <div class="form-group">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name" required autofocus value="{{ form_data.get('full_name', '') }}">
    </div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required value="{{ form_data.get('email', '') }}">
    </div>
    <div class="form-group">
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" value="{{ form_data.get('phone', '') }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required minlength="6">
          <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
            <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <div class="password-field">
          <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
          <button type="button" class="password-toggle" aria-label="Show password" data-target="confirm_password">
            <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
    <p class="text-center muted" style="margin-top:18px;font-size:0.9rem;">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </form>
</section>
{% endblock %}
